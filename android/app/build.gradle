apply plugin: 'com.android.application'

// Release signing: reads from android/keystore.properties (untracked — see
// keystore.properties.example) when present, so a debug build/CI run
// without a keystore configured still succeeds unsigned.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
// CI alternative to keystore.properties: ANDROID_KEYSTORE_PATH (decoded from
// the ANDROID_KEYSTORE_BASE64 secret into a temp file — never committed),
// ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
// Blank values (GitHub sets unset secrets to "") count as absent.
def envOrNull = { String name ->
    def v = System.getenv(name)
    return (v != null && !v.trim().isEmpty()) ? v : null
}
def signingStorePath = envOrNull('ANDROID_KEYSTORE_PATH') ?: keystoreProperties['storeFile']
def signingStoreFile = signingStorePath ? rootProject.file(signingStorePath) : null
def hasSigningConfig = signingStoreFile != null && signingStoreFile.isFile()
// Play needs a strictly increasing versionCode per upload; override without
// editing this file via -PversionCode=2 or VERSION_CODE env.
def appVersionCode = (findProperty('versionCode') ?: envOrNull('VERSION_CODE') ?: '1') as Integer
def appVersionName = (findProperty('versionName') ?: envOrNull('VERSION_NAME') ?: '1.0.0') as String

android {
    namespace = "com.princessninja.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.princessninja.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile signingStoreFile
                storePassword envOrNull('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
                keyAlias envOrNull('ANDROID_KEY_ALIAS') ?: keystoreProperties['keyAlias'] ?: 'upload'
                keyPassword envOrNull('ANDROID_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
