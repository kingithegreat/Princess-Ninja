name: Image Integrity

# Asserts that every committed image file actually decodes.
#
# Added 2026-07-25 after 36 PNG/WebP files across two repos were found corrupt
# (byte 0x89 replaced by the UTF-8 replacement character), including Vacuum
# Empire's adaptive launcher icon — which would have shipped to Google Play with
# a blank icon. Android CI was green the entire time, because nothing asserted
# that an image is an image. This job closes that gap.
#
# Pure stdlib Python: no pip install, no network, runs in seconds.

# Trigger note (learned the hard way on 2026-07-25): this must fire on
# 'claude/**' pushes, not just main + pull_request. Feature-branch PRs here are
# opened by auto-merge.yml using GITHUB_TOKEN, and GitHub deliberately does not
# let a GITHUB_TOKEN-triggered event start another workflow run — so a
# pull_request-only trigger produced a workflow that registered correctly and
# then never executed a single time. Same convention as ci.yml in these repos.
on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  image-integrity:
    name: image-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false # deliberate: a bare LFS pointer must be reported, not silently fetched

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify every committed image decodes
        run: python3 scripts/check-image-integrity.py .
